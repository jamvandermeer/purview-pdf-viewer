    <path d="M112 156 H196 a10 10 0 0 1 10 10 V206 a10 10 0 0 1 -10 10 H112 L86 186 Z" fill="url(#tag)" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
