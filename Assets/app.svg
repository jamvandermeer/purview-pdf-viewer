  </g>
  <path d="M154 20 V62 a12 12 0 0 0 12 12 H208 Z" fill="#D6DCE4" stroke="#B9C1CC" stroke-width="3" stroke-linejoin="round"/>
  <!-- tekstregels -->
  <g fill="#C3CAD4">
    <rect x="66" y="56" width="70" height="12" rx="6"/>
    <rect x="66" y="88" width="116" height="12" rx="6"/>
    <rect x="66" y="114" width="116" height="12" rx="6"/>
    <rect x="66" y="140" width="80" height="12" rx="6"/>
  </g>
  <!-- gevoeligheidslabel (tag) -->
